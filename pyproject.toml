[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "trimodal-joint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "torchvision>=0.18", "numpy", "scipy", "pandas", "openpyxl", "Pillow", "scikit-learn", "PyWavelets", "PyYAML"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
[project.scripts]
trimodal-joint = "trimodal_joint.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["third_party", "artifacts"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
